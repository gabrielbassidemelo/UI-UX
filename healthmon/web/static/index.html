<!doctype html>

<head>

<body>

    <button id="btn-sync" class="icon-btn" title="Sincronizar agora" aria-label="Sincronizar agora">⟳</button>
    <button id="btn-theme" class="icon-btn" title="Alternar tema" aria-label="Alternar tema">◐</button>
  </div>
</header>
<div id="demo-banner" class="banner" hidden>DADOS SIMULADOS — demonstração, não são dados reais.</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<main id="view" tabindex="-1"></main>
<nav class="tabs" aria-label="Navegação principal">
  <button data-tab="hoje" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/></svg>Hoje</button>

  <button data-tab="nutricao"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-2-2.5-6-1.5-6 3 0 4 2.5 9 6 9s6-5 6-9c0-4.5-4-5.5-6-3z"/><path d="M12 7c0-2 1-3 2.5-3.5"/></svg>Comida</button>
  <button data-tab="mais"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>Mais</button>
