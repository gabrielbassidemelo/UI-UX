<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saúde">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<title>Saúde e Desempenho</title>
</head>
<body>
<header class="top">
  <div class="top-title">
    <button id="btn-back" class="icon-btn" aria-label="Voltar" hidden>‹</button>
    <div><h1 id="title">Hoje</h1><p id="subtitle" class="muted">Carregando…</p></div>
  </div>
  <div class="top-actions">
    <button id="btn-sync" class="icon-btn" title="Sincronizar agora" aria-label="Sincronizar agora">⟳</button>
    <button id="btn-theme" class="icon-btn" title="Alternar tema" aria-label="Alternar tema">◐</button>
  </div>
</header>
<div id="demo-banner" class="banner" hidden>DADOS SIMULADOS — demonstração, não são dados reais.</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<main id="view" tabindex="-1"></main>
<nav class="tabs" aria-label="Navegação principal">
  <button data-tab="hoje" class="on"><span aria-hidden="true">●</span>Hoje</button>
  <button data-tab="saude"><span aria-hidden="true">♥</span>Saúde</button>
  <button data-tab="treino"><span aria-hidden="true">▲</span>Treino</button>
  <button data-tab="nutricao"><span aria-hidden="true">◆</span>Nutrição</button>
  <button data-tab="mais"><span aria-hidden="true">☰</span>Mais</button>
</nav>
<script src="/static/vendor/chart.umd.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
