<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saúde">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="stylesheet" href="/static/style.css">
<title>Entrar — Saúde e Recuperação</title>
</head>
<body>
<main class="login">
  <h1>Saúde e Recuperação</h1>
  <p class="muted">Acesso protegido. Seus dados ficam no seu computador.</p>
  <form id="f">
    <label for="senha" class="small muted">Senha do dashboard</label>
    <input id="senha" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Entrar</button>
    <p id="err" class="err" role="alert"></p>
  </form>
</main>
<script src="/static/login.js"></script>
</body>
</html>
