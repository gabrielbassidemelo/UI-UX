[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthmon"
version = "1.0.0"
description = "Monitoramento pessoal de saúde, sono e recuperação com dados do Garmin Connect (processamento local)."
requires-python = ">=3.11"
dependencies = [
  "garminconnect==0.3.20",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "apscheduler>=3.10,<4",
  "cryptography>=43",
  "requests>=2.32",
]

[project.optional-dependencies]
cloud-ai = ["anthropic>=1.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
healthmon = "healthmon.cli:main"

[tool.setuptools.packages.find]
include = ["healthmon*"]

[tool.setuptools.package-data]
healthmon = ["web/static/*", "web/static/vendor/*", "config.example.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
