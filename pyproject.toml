[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthmon"
version = "2.0.0"
description = "Monitoramento pessoal de saúde, sono e recuperação com dados do Garmin Connect (processamento local)."
requires-python = ">=3.12"
dependencies = [
  "garmin-connect-personal-api-python>=1.1,<2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "apscheduler>=3.10,<4",
  "cryptography>=43",
  "requests>=2.32",
]

[project.optional-dependencies]
cloud-ai = ["anthropic>=1.0"]
nao-oficial = ["garminconnect==0.3.20"]
push = ["pywebpush>=2.0"]
otimizacao = ["scipy>=1.13"]
dev = ["pytest>=8", "httpx>=0.27", "garminconnect==0.3.20", "scipy>=1.13", "pywebpush>=2.0", "pip-audit>=2.7"]

[project.scripts]
healthmon = "healthmon.cli:main"

[tool.setuptools.packages.find]
include = ["healthmon*"]

[tool.setuptools.package-data]
healthmon = ["web/static/*", "web/static/vendor/*", "config.example.toml", "kb/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
