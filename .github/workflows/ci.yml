# Integração contínua: testes e auditoria de dependências, SOMENTE com dados sintéticos.
# Este fluxo não coleta dados, não usa segredos e não funciona como servidor de monitoramento.
name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: pip-audit --skip-editable
