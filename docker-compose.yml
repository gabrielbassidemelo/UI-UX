# Use SEMPRE o roteiro guiado:  ./deploy/oracle/configurar.sh   (docs/IMPLANTACAO.md)
# Ele configura a chave de recuperação e a cópia externa dos backups ANTES de qualquer dado real.
# IA local opcional:  docker compose --profile ia-local up -d   e  [ia] modo = "local", ollama_url = "http://ollama:11434"
services:
  healthmon:
    build: .
    image: healthmon:local
    restart: unless-stopped
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8765:8765"   # só localhost; acesso pelo iPhone via Tailscale (ver docs/OPERACAO.md)
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 512m
    pids_limit: 200

  ollama:
    image: ollama/ollama:latest
    profiles: ["ia-local"]
    restart: unless-stopped
    volumes:
      - ./ollama:/root/.ollama
    # sem portas publicadas: acessível apenas pelo healthmon na rede interna do compose
