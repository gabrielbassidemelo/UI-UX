#cloud-config
# Oracle Cloud Always Free — preparação da VM (Ubuntu 24.04, AMD E2.1.Micro ou Ampere A1).
# Cole este arquivo em "Advanced options > Initialization script" ao criar a instância.
# NÃO coloque segredos aqui: a chave da Garmin e as senhas são digitadas depois, no terminal,
# pelo script deploy/oracle/configurar.sh. Nenhuma porta pública é aberta além do SSH
# padrão da Oracle, que o script fecha depois que o Tailscale estiver funcionando.
package_update: true
package_upgrade: true
packages: [ca-certificates, curl, git, ufw, unattended-upgrades]
swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G
write_files:
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/docker/daemon.json
    content: |
      {"log-driver": "json-file", "log-opts": {"max-size": "5m", "max-file": "3"}}
runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update && apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - curl -fsSL https://tailscale.com/install.sh | sh
  - timedatectl set-timezone America/Sao_Paulo
  # O operador é o usuário padrão 'ubuntu' (já tem sudo). Participar do grupo docker equivale a ser root na VM.
  - usermod -aG docker ubuntu
  - systemctl enable --now docker
